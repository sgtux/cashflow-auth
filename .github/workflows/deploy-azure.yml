name: Deploy to Azure App Service

# Dispara sozinho quando o "Build and Tests" (build.yml) terminar com sucesso em main - sem
# rebuildar aqui, so baixa o jar que aquele workflow ja publicou (elimina build+teste duplicado).
#
# Isso reintroduz deploy automatico pra producao a cada push em main. Se quiser um humano
# aprovando antes do deploy rodar de verdade (mesmo disparando sozinho), configure "Required
# reviewers" no Environment CashflowAuth (Settings > Environments > CashflowAuth) - o job pausa
# esperando aprovacao antes dos passos abaixo executarem.
#
# Redeploy manual do mesmo build: usa "Re-run jobs" na execucao do build.yml ou deste workflow
# na aba Actions - nao precisa de workflow_dispatch separado pra isso.
on:
  workflow_run:
    workflows: ["Build and Tests"]
    types: [completed]
    branches: [main]

# actions: read e o que permite baixar o artefato de outra run (o download-artifact precisa
# disso pra puxar de um workflow diferente do atual). id-token: write e o login OIDC do Azure.
permissions:
  actions: read
  id-token: write
  contents: read

env:
  # TODO: troque para o nome real do App Service (Azure Portal > App Service > Overview > Name).
  AZURE_WEBAPP_NAME: cashflow-auth

jobs:
  deploy:
    # So continua se o build.yml realmente passou (nao roda em build falho) e foi em main
    # (o filtro "branches: main" do gatilho acima ja restringe isso, esta condicao e redundancia
    # defensiva, nao custa nada ter as duas).
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: CashflowAuth
    timeout-minutes: 15

    steps:
      # Baixa o jar publicado pelo build.yml (mesmo commit que passou nos testes, inclusive
      # os de arquitetura) - nao ha "Set up JDK"/"mvn" aqui porque nao se builda nada de novo.
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: cashflow-auth-jar
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: target

      # Login via OIDC (Workload Identity Federation) - configure no Azure:
      # 1. App registration no Entra ID com federated credential apontando para este repo/branch/environment
      # 2. AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID como Secrets do Environment
      #    (Settings > Environments > CashflowAuth > Environment secrets)
      # Alternativa mais simples (porem menos segura, guarda segredo de longa duracao):
      # trocar este passo + o de deploy abaixo por azure/webapps-deploy com
      # `publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}`.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy jar to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: target/*.jar

      - name: Azure logout
        if: always()
        run: az logout
