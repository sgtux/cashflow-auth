name: Build and Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Uma execucao por branch/PR: um push novo cancela a anterior que ainda esta rodando.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compila, roda os testes e empacota o jar (o repo nao tem Maven Wrapper, entao usa o mvn do runner).
      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 7

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: cashflow-auth-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7
